<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />

    <!-- SEO -->
    <title>SITRA · POS para comercios modernos</title>
    <meta
      name="description"
      content="SITRA es un sistema de punto de venta (POS) rápido y seguro con inventario, facturación y reportes para tu negocio."
    />

    <!-- Open Graph -->
    <meta property="og:title" content="SITRA · POS para comercios modernos" />
    <meta
      property="og:description"
      content="Gestiona ventas, inventario y facturación desde un solo lugar."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:image"
      content="https://dummyimage.com/1200x630/111827/e2e8f0&text=SITRA+POS"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CDN (opcional si no usas PostCSS con Tailwind) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom global styles -->
    <style>
      :root {
        color-scheme: light dark;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }
      .glass {
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.08);
      }
      .brand-gradient {
        background-image: linear-gradient(
          135deg,
          #06b6d4 0%,
          #0ea5e9 30%,
          #6366f1 60%,
          #8b5cf6 100%
        );
      }
    </style>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
